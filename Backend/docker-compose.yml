version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devflow
      POSTGRES_PASSWORD: devflow
      POSTGRES_DB: devflow
    ports:
      - "5432:5432"
    volumes:
      - devflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devflow_redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devflow-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://devflow:devflow@postgres:5432/devflow?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  devflow_pg_data:
  devflow_redis_data: